name: Feature request
description: Propose a new capability or change for otaman-core
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        otaman-core is the shared kernel: code lives here only when **two or more
        repos** depend on it. Please keep that two-consumer rule in mind.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should otaman-core provide? Sketch the API or schema if relevant.
    validations:
      required: true
  - type: textarea
    id: consumers
    attributes:
      label: Which repos would consume this?
      description: Name the two-or-more repos that need it (bridge, cli, plugin, runner, ...).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why they fall short.
    validations:
      required: false
