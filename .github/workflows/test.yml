name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Force Node 24 runtime now (deprecated Node 20 removed Sep 16 2026).
  # Silences the warnings until upstream actions ship native Node-24 versions.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --extra test --no-dev

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Audit maestro references
        if: runner.os != 'Windows'
        run: bash scripts/audit-maestro-refs.sh src/
