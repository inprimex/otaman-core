name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Force Node 24 runtime now (deprecated Node 20 removed Sep 16 2026).
  # Silences the warnings until upstream actions ship native Node-24 versions.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --extra test

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type-check (mypy)
        run: uv run mypy src/otaman_core

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Build package
        run: uv build

      - name: Check distribution metadata
        run: uv run --with twine twine check dist/*

      - name: Import smoke test
        run: uv run python -c "import otaman_core"

      - name: Audit maestro references
        if: runner.os != 'Windows'
        run: bash scripts/audit-maestro-refs.sh src/

  # Changelog-fragment gate (release-notes-sibling-coverage 2.2): every
  # shipped-code PR carries a customer-facing changelog fragment, or the release
  # notes silently understate the release. The check is CORE-INVOKABLE — the one
  # identical line every sibling wires (1.3), NOT a repo-local script — so core,
  # bridge, and the other CLI-less repos all gate the same way. cli's
  # `otaman policy check-changelog` is the same logic for humans.
  changelog:
    name: changelog-fragment
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history so the base...HEAD merge-base diff resolves

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install package
        run: uv sync

      - name: Fetch base ref
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Write PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "${RUNNER_TEMP}/pr_body.txt"

      - name: Changelog fragment gate
        run: >
          uv run python -m otaman_core.changelog_fragment
          --check
          --base "origin/${{ github.base_ref }}"
          --pr "${{ github.event.pull_request.number }}"
          --pr-body-file "${RUNNER_TEMP}/pr_body.txt"

  # Aggregate gate: the single, rename-/matrix-churn-proof required check for
  # branch protection on main (fleet-uniform). `needs:` waits for every matrix
  # leg and the changelog gate; if any fails, ci-ok is skipped, which GitHub
  # treats as not-passed — so this blocks merges correctly. `changelog` is
  # skipped on push (PR-only), and a skipped need does not block ci-ok.
  ci-ok:
    name: ci-ok
    needs: [test, changelog]
    runs-on: ubuntu-latest
    steps:
      - run: echo ok
