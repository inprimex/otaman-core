# otaman-example platform configuration
# Three-repo demo project with observers, OpenSpec, and git_host stub.
#
# Paths are RELATIVE to this maestro folder. Do not use absolute paths
# (breaks cross-machine portability).

project: example-platform
version: "1.0"

repos:
  - name: frontend
    path: ../frontend
    owner: frontend-agent
    tech: [typescript, react]
    description: "Customer-facing React app"

  - name: backend
    path: ../backend
    owner: backend-agent
    tech: [python]
    description: "REST API + background workers"

  - name: specs
    path: ../specs
    owner: spec-agent
    tech: [docs]
    description: "OpenSpec source of truth for features"

# Spec format. The example ships OpenSpec; alternative is `format: fallback`
# which uses simple markdown proposals under .agents/proposals/
specs:
  path: ../specs
  format: openspec

# Cross-agent communication via file-based bus
communication:
  bus_path: .agents/bus
  format: markdown
  max_age_days: 30

# Observer roles trigger on events (PRs, spec changes, etc.)
# See: /otaman:review command and references/agent-roles.md
observers:
  - role: cto-reviewer
    triggers: [pr, spec-change, architecture-change]
  - role: security
    triggers: [pr, dependency-update, auth-change]

# Launcher profiles for selective tab launches
profiles:
  fullstack:
    description: "Frontend + backend (typical feature work)"
    repos: [frontend, backend, specs]
  backend-only:
    description: "Backend iteration (API + workers)"
    repos: [backend, specs]
  frontend-only:
    description: "Frontend iteration"
    repos: [frontend, specs]
  full:
    description: "All three repos"
    repos: all

# Uncomment to enable PR/MR features. See references/git-host-setup.md
# for PAT creation steps per provider.
#
# git_host:
#   provider: github                # github | gitlab | bitbucket | azure-devops
#   token:
#     sources:
#       - { type: env,     name: OTAMAN_GH_PAT_EXAMPLE }
#       - { type: dotenv,  name: OTAMAN_GH_PAT_EXAMPLE }
#       - { type: keyring, service: otaman, account: gh-pat-example }

launcher:
  local:
    enabled: true
  ssh:
    enabled: false
    host: user@host.example.com
    repo_path: /home/user/projects/example-platform

program:
  claude:
    config_dir: ~/.claude
  roles:
    - id: developer
      name: Developer
    - id: reviewer
      name: Reviewer
  releases:
    - id: v1.0
      description: "Initial release"
  t-shirt-scale:
    S: 0.5
    M: 1.0
    L: 2.0
    XL: 4.0

# security-gates-hook-c: Hook C's cost-stratified pre-PR security ladder.
security-gates:
  relocation-note: "Anticipated home: verification-gates.yaml (JTBD-59)."
  languages:
    python:
      pre-commit:
        tools: [ruff, mypy, detect-secrets]
        blocking: true
      ci-fast:
        tools: [gitleaks, bandit, pip-audit]
        timeout: 30
        blocking: true
      ci-medium:
        tools: [semgrep, licensee]
        scanner-pair: [trivy, grype]
        timeout: 300
        blocking: true
      ci-slow:
        tools: [semgrep-deep]
        blocking: false
      llm-observer:
        blocking: false
        cost-cap: 0.5
  repos:
    backend:
      languages: [python]
      ci-medium:
        scanner-pair: [trivy, osv-scanner]
      # opt-in is a per-repo decision — this repo opts into the advisory ci-slow layer
      ci-slow:
        opt-in: true
    specs:
      opt-out: true

# harness-version-management: the one authoritative exact pin for the harness binary.
runner:
  harnesses:
    - id: claude-code
      binary: claude
      pin: "1.2.3"

# llm-router-backend: opt-in LLM routing (absent = native path, byte-identical).
router:
  backend: litellm-proxy
  base_url: "http://localhost:4000"
  local_only_classes: [cofounder-only]
