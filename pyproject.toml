[project]
name = "otaman-core"
version = "0.1.0"
description = "Otaman platform kernel: storage protocols, ownership resolution, secrets chain, schemas, hooks, OTel helpers, spec backend protocol"
requires-python = ">=3.10"
authors = [{ name = "Otaman platform" }]
license = { text = "UNLICENSED" }
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/otaman_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
