[project]
name = "otaman-core"
version = "0.3.0"
description = "Otaman platform kernel: storage protocols, ownership resolution, secrets chain, schemas, hooks, OTel helpers, spec backend protocol"
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "Otaman platform" }]
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "pyyaml>=6",
    "jsonschema>=4",
    # registry-access-contract: round-trip (comment + key-order preserving) YAML for
    # the registry file backend — byte-equivalent writes over human-annotated registers
    # (spec-agent ruling A 20261002T150612; pyyaml would strip the annotations).
    "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
keyring = ["keyring>=24"]
oidc = ["pyjwt[crypto]>=2.8"]
web-auth = ["pyjwt[crypto]>=2.8", "bcrypt>=4"]
wiki = ["tree-sitter>=0.25", "tree-sitter-python>=0.25"]
test = [
    "pytest>=7",
    "keyring>=24",
    "pyjwt[crypto]>=2.8",
    "bcrypt>=4",
    "tree-sitter>=0.25",
    "tree-sitter-python>=0.25",
]

[dependency-groups]
dev = [
    "ruff==0.16.3",  # ce-lint-standard: pin exact (F182 — no CI tooling drift)
    "mypy>=1.10",
    "types-pyyaml",
    "types-jsonschema",
    "pyjwt[crypto]>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/otaman_core"]
include = ["src/otaman_core/schemas/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
# ce-lint-standard baseline (otaman-specs #142). Config here, not ruff.toml.
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# ce-lint-standard floor — may add categories, must not remove these.
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# pytest.importorskip before imports is idiomatic in tests
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["src/otaman_core"]
