[project]
name = "otaman-core"
version = "0.2.0"
description = "Otaman platform kernel: storage protocols, ownership resolution, secrets chain, schemas, hooks, OTel helpers, spec backend protocol"
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "Otaman platform" }]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "pyyaml>=6",
    "jsonschema>=4",
]

[project.optional-dependencies]
keyring = ["keyring>=24"]
oidc = ["pyjwt[crypto]>=2.8"]
wiki = ["tree-sitter>=0.25", "tree-sitter-python>=0.25"]
test = ["pytest>=7", "keyring>=24", "tree-sitter>=0.25", "tree-sitter-python>=0.25"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "types-pyyaml",
    "types-jsonschema",
    "pyjwt[crypto]>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/otaman_core"]
include = ["src/otaman_core/schemas/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
# Explicit config so CI and local runs agree regardless of ambient configs.
line-length = 100

[tool.ruff.lint]
# Baseline: pyflakes/pycodestyle errors + import sorting. Tighten over time.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# pytest.importorskip before imports is idiomatic in tests
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["src/otaman_core"]
