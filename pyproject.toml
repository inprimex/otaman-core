[project]
name = "otaman-core"
version = "0.1.0"
description = "Otaman platform kernel: storage protocols, ownership resolution, secrets chain, schemas, hooks, OTel helpers, spec backend protocol"
requires-python = ">=3.10"
authors = [{ name = "Otaman platform" }]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "pyyaml>=6",
    "jsonschema>=4",
]

[project.optional-dependencies]
keyring = ["keyring>=24"]
test = ["pytest>=7", "keyring>=24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/otaman_core"]
include = ["src/otaman_core/schemas/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
