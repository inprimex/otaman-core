# JSON Schema for platform.yaml (expressed in YAML for readability)
# Used by scripts/validate-platform.py to validate user configs.

type: object
required: [project, version, repos]
additionalProperties: false

properties:
  project:
    type: string
    pattern: "^[a-z][a-z0-9-]{1,63}$"
    description: "Project identifier (lowercase, hyphens, 2-64 chars)"

  version:
    type: string
    enum: ["1.0"]
    description: "Schema version"

  repos:
    type: array
    minItems: 1
    items:
      type: object
      required: [name, path, owner]
      additionalProperties: false
      properties:
        name:
          type: string
          pattern: "^[A-Za-z][A-Za-z0-9._-]{1,63}$"
          description: "Repo identifier — allows letters (any case), digits, dots, dashes, underscores. Real-world repos like 'GreenBin.Resources' or 'web.public' work as-is."
        path:
          type: string
          description: "Relative path to the repo directory (from the otaman workspace folder, e.g. ../my-repo)"
        owner:
          type: string
          pattern: "^[a-z][a-z0-9-]{1,63}$"
          description: "Agent name that owns this repo (catch-all when owner-paths is set)"
        owner-paths:
          type: object
          additionalProperties:
            type: string
            pattern: "^[a-z][a-z0-9-]{1,63}$"
          description: >
            monorepo-path-ownership: map gitignore-style glob → agent name. Paths
            matching the glob route to the named agent; unmatched paths fall back
            to the repo's catch-all owner:. See otaman_core.owner_paths.
        remote:
          type: string
          description: "Git remote URL for cloning (e.g., git@github.com:org/repo.git)"
        tech:
          type: array
          items:
            type: string
          description: "Technology stack tags"
        description:
          type: string
          maxLength: 256
          description: "Human-readable repo description"
        disabled:
          type: boolean
          default: false
          description: "If true, this repo is skipped by the launcher, task assignment, and status aggregation. Use for archived or suspended repos. Override in the launcher with -IncludeDisabled."
        specs_dir:
          type: array
          items:
            type: string
          description: "Spec folder names in the specs repo that map to this repo"
        launch:
          type: object
          required: [shell, commands]
          additionalProperties: false
          properties:
            title:
              type: string
              maxLength: 64
              description: "Terminal tab title (defaults to repo name)"
            color:
              type: string
              pattern: "^#[0-9a-fA-F]{6}$"
              description: "Hex color for terminal tab"
            shell:
              type: string
              enum: [wsl, powershell, bash, ssh]
              description: "Shell type: wsl (Windows/WSL), powershell (Windows), bash (Linux/macOS), ssh (remote server)"
            ssh_host:
              type: string
              description: "SSH target (e.g., user@hostname). Required when shell=ssh."
            ssh_path:
              type: string
              description: "Absolute path to repo on the remote server. If omitted, uses repo path."
            commands:
              type: array
              minItems: 1
              items:
                type: string
              description: "Sequential commands to execute in the shell"

  specs:
    type: object
    required: [format]
    additionalProperties: false
    properties:
      path:
        type: string
        description: "Relative path to specs repo (required when format=openspec)"
      format:
        type: string
        enum: [openspec, fallback]
        description: "openspec = delegate to OpenSpec plugin; fallback = otaman lightweight proposals"
    # Note: path is required when format=openspec. This is enforced by validate-platform.py
    # since JSON Schema conditionals (if/then) are not widely supported in YAML schema loaders.

  contracts:
    type: object
    required: [path, format]
    additionalProperties: false
    properties:
      path:
        type: string
        description: "Relative path to API contracts directory"
      format:
        type: string
        enum: [openapi, jsonschema, protobuf]
      auto_detect:
        type: boolean
        default: true
        description: "Scan for *.openapi.yaml, swagger/, etc."

  observers:
    type: array
    items:
      type: object
      required: [role, triggers]
      additionalProperties: false
      properties:
        role:
          type: string
          pattern: "^[a-z][a-z0-9-]{1,63}$"
        triggers:
          type: array
          minItems: 1
          items:
            type: string
            enum:
              - pr
              - spec-change
              - architecture-change
              - dependency-update
              - auth-change
              - infra-change
              - dockerfile-change
              - ci-change
              - code-change

  communication:
    type: object
    required: [bus_path, format]
    additionalProperties: false
    properties:
      bus_path:
        type: string
        description: "Relative path to the message bus directory"
      format:
        type: string
        enum: [markdown]
      max_age_days:
        type: integer
        minimum: 1
        maximum: 365
        default: 30

  # --- Phase 7+ optional sections (additive, backward-compatible) ---

  git_host:
    type: object
    required: [provider, token]
    additionalProperties: false
    properties:
      provider:
        type: string
        enum: [github, gitlab, bitbucket, azure-devops, gitea, forgejo]
        description: "Git host provider. Drives which adapter loads in scripts/git_host_<provider>.py."
      host:
        type: string
        description: "Hostname override (e.g., GitHub Enterprise). Defaults to the provider's SaaS host (github.com, gitlab.com, etc.)."
      token:
        oneOf:
          - type: object
            required: [sources]
            additionalProperties: false
            properties:
              sources:
                type: array
                minItems: 1
                items:
                  oneOf:
                    - type: object
                      required: [type, name]
                      additionalProperties: false
                      properties:
                        type:
                          type: string
                          enum: [env]
                        name:
                          type: string
                          description: "Environment variable name (e.g., MAESTRO_GH_TOKEN)"
                    - type: object
                      required: [type, name]
                      additionalProperties: false
                      properties:
                        type:
                          type: string
                          enum: [dotenv]
                        name:
                          type: string
                          description: "Variable name to read from .otaman/secrets.env"
                        path:
                          type: string
                          description: "Optional path override (defaults to .otaman/secrets.env)"
                    - type: object
                      required: [type, account]
                      additionalProperties: false
                      properties:
                        type:
                          type: string
                          enum: [keyring]
                        service:
                          type: string
                          description: "Keyring service name (defaults to 'otaman')"
                        account:
                          type: string
                          description: "Keyring account/key (e.g., 'gitlab-greenbin', 'tg-personal')"
          - type: string
            description: "Inline literal token (NOT recommended — use a SecretRef sources block instead)."
        description: "PAT lookup chain. Otaman never stores the token in YAML; it resolves at runtime from env / dotenv / OS keyring. See scripts/_secrets.py."
      default_scope:
        type: array
        items:
          type: string
        description: "Documents intended scope (read, write, etc.) — informational, not enforced."
      org:
        type: string
        description: "Default org/namespace for new repos created via `otaman project add`. Optional."
    description: "Git host PR/MR API integration (Phase 7). Enables `otaman git-host pr|post-review`."

  git_platform:
    type: object
    additionalProperties: true
    properties:
      provider:
        type: string
        enum: [github, gitlab, bitbucket, azure-devops]
      org:
        type: string
        description: "Organization or namespace under which repos live. Used by clone-project.py to derive remotes when a repo entry has no explicit `remote:` field."
    description: "Lightweight platform metadata for cloning/setup. Distinct from git_host: (which is the API integration). Either or both may be set."

  models:
    type: object
    additionalProperties: false
    properties:
      default:
        type: string
        enum: [opus, sonnet, haiku, inherit]
        description: "Project-wide default model alias. 'inherit' means use Claude Code's own default."
      default_effort:
        type: string
        enum: [low, medium, high, xhigh, max, inherit]
        description: "Project-wide default effort/thinking level."
      by_repo:
        type: object
        additionalProperties:
          type: object
          additionalProperties: false
          properties:
            model:
              type: string
              enum: [opus, sonnet, haiku, inherit]
            effort:
              type: string
              enum: [low, medium, high, xhigh, max, inherit]
        description: "Per-repo model/effort overrides. Keys are repo names matching repos[].name."
      by_agent:
        type: object
        additionalProperties:
          type: object
          additionalProperties: false
          properties:
            model:
              type: string
              enum: [opus, sonnet, haiku, inherit]
            effort:
              type: string
              enum: [low, medium, high, xhigh, max, inherit]
        description: "Per-agent model/effort overrides. Keys are agent names matching repos[].owner."
    description: >
      Model + effort tier resolution. Walks: CLI override → by_repo → by_agent →
      default. The launcher injects ANTHROPIC_MODEL / CLAUDE_CODE_EFFORT_LEVEL
      based on the resolved tier. See scripts/_models_resolve.py and
      `otaman models` CLI.

  domain:
    type: string
    enum: [healthcare, fintech, marketplace, ml-ai, saas, ecommerce, iot, general]
    description: "Project domain — loads domain-specific agent templates, path rules, and estimation adjustments"

  lifecycle:
    type: object
    additionalProperties: false
    properties:
      phases:
        type: array
        items:
          type: string
        description: >
          Custom lifecycle phases for this project. Default: [presale, discovery, development, support].
          Override per domain/company (e.g., [presale, discovery, mvp, phase-2, launch, support]).
      gates:
        type: object
        additionalProperties:
          type: object
          properties:
            required:
              type: array
              items:
                type: string
              description: "Artifact files that must exist before passing this gate"
            checks:
              type: array
              items:
                type: string
              description: "Validation commands to run (e.g., 'pytest', 'otaman validate')"
        description: >
          Gate definitions keyed by transition name (e.g., "discovery-to-development").
          Each gate lists required artifacts and validation checks.

  standards:
    type: object
    additionalProperties: false
    properties:
      methodology:
        type: array
        items:
          type: string
        description: "Development methodologies: tdd, ddd, bdd, trunk-based, gitflow, conventional-commits, etc."
      git:
        type: object
        additionalProperties: false
        properties:
          branching:
            type: string
            enum: [trunk-based, gitflow, github-flow, custom]
            description: "Branching strategy. Use 'custom' when none of the standard models fit; document the actual workflow in 'notes'."
          commits:
            type: string
            enum: [conventional, freeform]
          pr_required:
            type: boolean
            default: true
          protected_branches:
            type: array
            items:
              type: string
            description: "Branches that agents cannot commit to directly (default: main, master, develop)"
          development_branch:
            type: string
            description: "Long-lived branch where agents land integration work (e.g., 'develop', 'staging'). Distinct from main/master which is reserved for release."
          notes:
            type: string
            description: "Free-form description of the team's git workflow — used to elaborate on 'custom' branching, document review rules, etc. Injected into generated CLAUDE.md."
      api:
        type: object
        additionalProperties: false
        properties:
          style:
            type: string
            enum: [rest, graphql, grpc, mixed]
          spec:
            type: string
            description: "API spec format (e.g., openapi-3.1)"
          versioning:
            type: string
            enum: [url, header, none]
          format:
            type: string
            description: "Response format (e.g., json-api, plain-json)"
      repo_standards:
        type: object
        additionalProperties:
          type: object
          additionalProperties: true
          properties:
            language:
              type: string
            runtime:
              type: string
            framework:
              type: string
            package_manager:
              type: string
            styling:
              type: string
            testing:
              type: object
              additionalProperties: false
              properties:
                unit:
                  type: string
                e2e:
                  type: string
                coverage_min:
                  type: integer
                  minimum: 0
                  maximum: 100
            patterns:
              type: array
              items:
                type: string
              description: "Architecture patterns: ddd, cqrs, event-sourcing, feature-sliced-design, etc."
            linting:
              type: array
              items:
                type: string
            rules:
              type: array
              items:
                type: string
              description: "Free-form project-specific coding rules injected into CLAUDE.md"
        description: >
          Per-repo standards keyed by repo name. Overrides/extends project-wide defaults.

  profiles:
    type: object
    additionalProperties:
      type: object
      properties:
        description:
          type: string
        repos:
          oneOf:
            - type: array
              items:
                type: string
            - type: string
              enum: [all]
      required: [repos]
    description: >
      Launch profiles — named groups of repos for specific workflows.
      Used by launch-agents.ps1 to filter which agents to launch.

  wiki:
    type: object
    additionalProperties: false
    properties:
      level:
        type: string
        enum: [minimal, standard, full]
        default: standard
        description: >
          Wiki depth level for entity-file generation.
          minimal  — Platform + Containers + Decisions only;
          standard — + Component pages with C4 diagrams;
          full     — + L4 code-unit pages for all public documented functions/methods.
    description: >
      Wiki ingestion configuration. Controls how deeply the wiki pipeline
      (otaman_core.wiki) generates entity files from this project's source.

  knowledge:
    type: array
    items:
      type: object
      required: [pack]
      additionalProperties: false
      properties:
        pack:
          type: string
          description: "Knowledge pack reference: name@version (from revlet.ai) or 'manual' for human-provided"
        path:
          type: string
          description: "Local path for manual knowledge (e.g., .agents/knowledge/eclinicalworks-api/)"
        status:
          type: string
          enum: [ready, needs_docs, needs_examples, needs_full_docs]
          description: "Knowledge readiness status"
    description: >
      Tech stack knowledge packs. Auto-fetched from revlet.ai when available,
      or manually provided by human. Referenced in generated CLAUDE.md.

  launcher:
    type: object
    additionalProperties: false
    description: >
      Launch configuration for local and remote (SSH) sessions.
      Used by launch_resolve.py to drive `otaman session spawn`.
      Emitted by `otaman init` / `post_scan` into platform.yaml.
    properties:
      local:
        type: object
        additionalProperties: false
        description: "Local session spawn settings."
        properties:
          enabled:
            type: boolean
            default: true
            description: "Enable local session spawning (default: true)."
      ssh:
        type: object
        additionalProperties: false
        description: "SSH-based remote session spawn settings."
        properties:
          enabled:
            type: boolean
            default: false
            description: "Enable SSH remote session spawning (default: false)."
          host:
            type: string
            description: "SSH target (e.g., user@hostname)."
          repo_path:
            type: string
            description: "Absolute path to the repo root on the remote host."

  program:
    type: object
    additionalProperties: true
    description: >
      Program-level metadata: process opt-ins, role definitions, release milestones,
      effort scale, and Claude profile. Extra keys are allowed — this block grows as
      additional registries (outcomes, solutions) land. Use additionalProperties: true
      to avoid churn while the schema evolves.
    properties:
      claude:
        type: object
        additionalProperties: false
        description: "Claude Code profile configuration (program-init-claude-profile)."
        properties:
          config_dir:
            type: string
            description: >
              CLAUDE_CONFIG_DIR path; preserves the user's OAuth profile across
              sessions. Also accepted as 'config-dir' (alias).
          config-dir:
            type: string
            description: "Alias for config_dir."
      processes:
        type: object
        additionalProperties: true
        description: >
          Process-level opt-in flags (e.g., outcomes.enabled: true,
          solutions.enabled: true). Keys mirror registry names.
      roles:
        type: array
        description: "Role definitions for role-based routing and task assignment."
        items:
          type: object
          required: [id, name]
          additionalProperties: false
          properties:
            id:
              type: string
              description: "Role identifier (slug)."
            name:
              type: string
              description: "Human-readable role name."
            description:
              type: string
              default: ""
              description: "Optional description of this role."
      role-assignments:
        type: object
        additionalProperties:
          type: string
        description: "Map from role id to agent name."
      releases:
        type: array
        description: "Release milestones for outcome and solution tracking."
        items:
          type: object
          required: [id]
          additionalProperties: false
          properties:
            id:
              type: string
              description: "Release identifier (e.g., 'v1.0', 'mvp')."
            description:
              type: string
              default: ""
              description: "Optional description of this release."
      t-shirt-scale:
        type: object
        additionalProperties:
          type: number
        description: >
          Named effort tiers mapping size label to relative cost multiplier
          (e.g., S: 0.5, M: 1.0, L: 2.0, XL: 4.0). Used by the estimator.

  # ---------------------------------------------------------------------------
  # bus-cc-routing (PR #50)
  #
  # Top-level `bus:` block governs message routing rules and the bus transport.
  bus:
    type: object
    additionalProperties: true   # spec still evolving; permissive at root
    description: "Bus routing + transport config (bus-cc-routing)."
    properties:
      routing_rules:
        type: array
        description: "CC rules applied to messages matching `when:` clauses."
        items:
          type: object
          additionalProperties: false
          required: [when, cc]
          properties:
            when:
              type: object
              additionalProperties: false
              description: >
                Match clauses ANDed together. A rule fires only when every
                specified field matches the incoming message.
              properties:
                to:
                  type: string
                  description: "Match on recipient (e.g., 'human', '<agent-name>')."
                priority:
                  oneOf:
                    - type: string
                    - type: array
                      items:
                        type: string
                  description: "Match on priority — single value or list."
                type:
                  type: string
                  description: >
                    Match on message type (e.g., 'outcome-proposal').
                    Added by outcome-proposal-routing.
            cc:
              type: array
              items:
                type: string
              description: "Agents to CC when the `when:` clauses match."
      transport:
        type: object
        additionalProperties: true
        description: >
          Bus transport selection. CE: file-based (default). EE: nats-kv,
          redis, etc. Shape evolves with the transport plugin contract.

  # ---------------------------------------------------------------------------
  # otaman-remote-terminal / ce-org-agent-bootstrap
  #
  # Top-level `terminal:` carries operator-facing terminal settings for the
  # bridge/web terminal (interactive, audit, auth) and bootstrap-emitted CE keys.
  terminal:
    type: object
    additionalProperties: true   # spec evolving; permissive
    description: "Terminal/bridge runtime configuration (otaman-remote-terminal)."

  # ---------------------------------------------------------------------------
  # ce-org-agent-bootstrap / ce-bootstrap-harness-deps
  #
  # Top-level `runner:` carries runner-side bootstrap config: agent_bootstrap
  # injection paths, harness binary verifications, etc.
  runner:
    type: object
    additionalProperties: true   # spec evolving; permissive
    description: "Runner runtime configuration (ce-org-agent-bootstrap, ce-bootstrap-harness-deps)."
    properties:
      agent_bootstrap:
        type: object
        additionalProperties: true
        description: >
          Bootstrap injection paths (paths relative to platform.yaml's dir).
          Used by the runner when spawning Claude Code sessions.
        properties:
          mcp_config:
            type: string
            description: "Path to .mcp.json (forwarded as `claude --mcp-config <path>`)."
          system_prompt_append:
            type: string
            description: "Path to CLAUDE.md or similar (forwarded as `--append-system-prompt`)."
      harnesses:
        type: array
        description: "Harness binary declarations (ce-bootstrap-harness-deps)."
        items:
          type: object
          additionalProperties: true
          properties:
            id:
              type: string
            binary:
              type: string
            min_version:
              type: string

  # ---------------------------------------------------------------------------
  # agent-status-presence
  #
  # Top-level `agent_presence:` feature switch (boolean). When false, all
  # status writes/reads are no-ops fleet-wide.
  agent_presence:
    type: boolean
    default: true
    description: >
      agent-status-presence feature switch. Default true. False = all
      status writes/reads no-op fleet-wide.

  # ---------------------------------------------------------------------------
  # agent-status-presence / otaman-init-dev-scaffold
  #
  # Top-level `agents:` registry. Two known shapes coexist while the spec
  # converges: (a) array of {name, enabled} from otaman-init-dev-scaffold;
  # (b) mapping {agent_name: {owns, role, ...}} from program-companion-repos-scaffold.
  # Accept both via oneOf.
  agents:
    oneOf:
      - type: array
        items:
          type: object
          additionalProperties: true
          properties:
            name:
              type: string
            enabled:
              type: boolean
      - type: object
        additionalProperties: true
    description: "Agent registry. Array form (otaman-init) OR mapping form (program-companion)."

  # ---------------------------------------------------------------------------
  # Multi-org future specs
  #
  # Top-level `orgs:` mapping org-slug -> object. Permissive while specs evolve.
  orgs:
    type: object
    additionalProperties: true
    description: "Multi-org runtime mapping (placeholder; shape evolving)."

  # ---------------------------------------------------------------------------
  # otaman-onboarding-cli-program-init wizard output
  #
  # The program-init wizard writes these top-level keys directly. They are
  # currently failing validation on live projects (e.g., ehrbridge). All
  # accepted permissively here so wizard output validates clean.
  description:
    type: string
    description: "Program description (program-init wizard output)."

  edition:
    type: string
    enum: [ce, ee, pe]
    description: "Otaman edition this program targets. CE = community."

  mode:
    type: integer
    minimum: 1
    description: "Program mode tier (1 = dev, 2 = strategy/cofounder, ...)."

  domains:
    type: array
    items:
      type: string
    description: "Program domain tags (e.g., software-development, healthcare)."

  roles:
    type: array
    description: >
      Role list. Wizard emits flat strings (['CPO', 'CTO', ...]); the program:
      block also has a structured `program.roles[]` (objects with id/name).
      Accept both shapes here so the wizard output validates and the structured
      form is consumed by the strategy registries.
    items:
      oneOf:
        - type: string
        - type: object
          additionalProperties: true

  releases:
    type: array
    description: >
      Release list (wizard emits flat strings; program: block has structured
      objects). Both shapes accepted at root for backwards compat.
    items:
      oneOf:
        - type: string
        - type: object
          additionalProperties: true

  currency:
    type: object
    additionalProperties: false
    description: "Program currency settings (program-init wizard)."
    properties:
      code:
        type: string
        description: "ISO 4217 currency code (e.g., USD, EUR)."
      symbol:
        type: string
        description: "Currency symbol (e.g., $, €)."
      decimal_places:
        type: integer
        minimum: 0
        maximum: 4

  triage:
    type: object
    additionalProperties: true
    description: "Triage scale configuration (program-init wizard)."
    properties:
      probability_scale:
        type: string
      impact_scale:
        type: string

  skills:
    type: object
    additionalProperties: true
    description: "Skills profile (program-init wizard)."
    properties:
      profile:
        type: string
        description: "Named skills profile (e.g., healthcare-default)."
      extra:
        type: array
        items:
          type: string

  # ---------------------------------------------------------------------------
  # human-roster
  #
  # Top-level `human-roster:` — list of people the bridge can resolve PM
  # assignees against (see otaman_core.human_roster.HumanRosterEntry).
  # Loader also enforces a semantic rule (non-empty `roles`) — JSON Schema
  # mirrors this via `minItems: 1` so the failure surfaces both via
  # `otaman validate` and `load_human_roster`.
  human-roster:
    type: array
    description: >
      Roster of humans involved in the program; consumed by the bridge for
      role-to-assignee resolution and by `otaman pm init --roster` for
      PM-user-id auto-resolution.
    items:
      type: object
      required: [name, email, roles]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          description: "Person's display name."
        email:
          type: string
          minLength: 1
          description: "Person's email — canonical key for PM-user-id resolution."
        roles:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
          description: >
            Non-empty list of role tags this person fills (e.g., cofounder,
            cto, cpo, developer). Used by the bridge's priority resolution.
        pm-user-id:
          type: integer
          description: >
            Optional PM-tool user id. Absent until resolved by
            `otaman pm init --roster`.
